[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktime-backend"
version = "0.1.0"
description = "FastAPI backend for the Worktime shift tracker and time-off management system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "pycountry>=24.6.1",
  "PyJWT>=2.11.0",
  "pwdlib[argon2]>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
