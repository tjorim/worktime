[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktime-backend"
version = "0.1.0"
description = "FastAPI backend for the Worktime shift tracker and time-off management system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.0",
  "uvicorn[standard]>=0.46.0",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.3.3",
  "alembic>=1.14",
  "pydantic[email]>=2.13.2",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "pycountry>=24.6.1",
  "supertokens-python>=0.31.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "anyio>=4",
  "ruff>=0.15.11",
  "ty~=0.0.31",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.rules]
unresolved-attribute = "warn"
