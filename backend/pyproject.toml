[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktime-backend"
version = "0.1.0"
description = "FastAPI backend for the Worktime shift tracker and time-off management system"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "fastapi==0.138.1",
  "fastmcp==3.4.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pycountry==26.2.16",
  "pydantic[email]==2.13.4",
  "pydantic-settings==2.14.2",
  "PyJWT[crypto]==2.13.0",
  "python-dotenv==1.2.2",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.49.0",
]

[dependency-groups]
dev = [
  "anyio==4.14.1",
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.20",
  "sentry-sdk[fastapi]==2.63.0",
  "ty==0.0.54",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.rules]
unresolved-attribute = "warn"
