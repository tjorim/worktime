[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktime-backend"
# This is packaging metadata only, never read at runtime — the project runs
# from source (uv run / the Docker image), never installed as a distributable
# wheel, so nothing reads this field. The real version lives in /VERSION
# (see app/version.py) and is what app/main.py, the frontend, and Android use.
version = "0.0.0"
description = "FastAPI backend for the Worktime shift tracker and time-off management system"
requires-python = ">=3.15"
dependencies = [
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "fastapi==0.162.0",
  "fastmcp==4.1.5",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.7",
  "pycountry==26.2.16",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "PyJWT[crypto]==2.13.0",
  "python-dotenv==1.2.4",
  "sqlalchemy[asyncio]==2.1.6",
  "uvicorn[standard]==0.54.0",
  "limits==5.8.0",
  "aiosqlite>=0.22.1",
  "pywebpush>=2.4.0",
  "firebase-admin==7.7.0",
]

[dependency-groups]
dev = [
  "anyio==4.16.0",
  "httpx==0.28.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.3",
  "sentry-sdk[fastapi]==2.73.0",
  "ty==0.0.95",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
