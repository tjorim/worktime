[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktime-backend"
# This is packaging metadata only, never read at runtime — the project runs
# from source (uv run / the Docker image), never installed as a distributable
# wheel, so nothing reads this field. The real version lives in /VERSION
# (see app/version.py) and is what app/main.py, the frontend, and Android use.
version = "0.0.0"
description = "FastAPI backend for the Worktime shift tracker and time-off management system"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "fastmcp==4.0.0b1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pycountry==26.2.16",
  "pydantic[email]==2.13.4",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "python-dotenv==1.2.2",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.52.1",
  "slowapi==0.1.10",
  "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
  "anyio==4.14.2",
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.1",
  "sentry-sdk[fastapi]==2.66.1",
  "ty==0.0.66",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.rules]
unresolved-attribute = "warn"

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b1"]
