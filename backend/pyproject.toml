[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktime-backend"
# This is packaging metadata only, never read at runtime — the project runs
# from source (uv run / the Docker image), never installed as a distributable
# wheel, so nothing reads this field. The real version lives in /VERSION
# (see app/version.py) and is what app/main.py, the frontend, and Android use.
version = "0.0.0"
description = "FastAPI backend for the Worktime shift tracker and time-off management system"
requires-python = ">=3.14"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.32.0",
  "fastapi==0.142.2",
  "fastmcp==4.0.11",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "pycountry==26.2.16",
  "pydantic[email]==2.13.5",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "python-dotenv==1.2.4",
  "sqlalchemy[asyncio]==2.1.3",
  "uvicorn[standard]==0.54.0",
  "slowapi==0.1.10",
  "aiosqlite>=0.22.1",
  "pywebpush>=2.4.0",
  "firebase-admin==7.7.0",
]

[dependency-groups]
dev = [
  "anyio==4.15.1",
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
  "sentry-sdk[fastapi]==2.71.0",
  "ty==0.0.84",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
