[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "worktime-backend"
# This is packaging metadata only, never read at runtime — the project runs
# from source (uv run / the Docker image), never installed as a distributable
# wheel, so nothing reads this field. The real version lives in /VERSION
# (see app/version.py) and is what app/main.py, the frontend, and Android use.
version = "0.0.0"
description = "FastAPI backend for the Worktime shift tracker and time-off management system"
requires-python = ">=3.15"
dependencies = [
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "fastapi==0.164.0",
  "fastmcp==4.2.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.9",
  "pycountry==26.2.16",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "pyjwt[crypto]==2.15.1",
  "python-dotenv==1.2.4",
  "sqlalchemy[asyncio]==2.1.9",
  "uvicorn[standard]==0.54.0",
  "limits==5.8.0",
  "aiosqlite==0.22.1",
  "pywebpush==2.5.0",
  "firebase-admin==7.8.0",
]

[dependency-groups]
dev = [
  "anyio==4.16.0",
  "jsonschema==4.26.0",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "pytest-cov==7.1.0",
  "rfc3339-validator==0.1.4",
  "ruff==0.17.5",
  "sentry-sdk[fastapi]==2.75.0",
  "ty==0.0.105",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:anyio"
markers = ["anyio: marks tests as anyio-compatible (no-op under asyncio_mode=auto)"]
testpaths = ["tests"]
# Third-party deprecations we cannot fix here; each entry is scoped to the emitting
# module. Drop an entry once its upstream release stops warning.
filterwarnings = [
  # fastmcp's py-key-value-aio protocol is checked by beartype without @runtime_checkable.
  "ignore:.*isn't explicitly decorated with @runtime_checkable:DeprecationWarning:beartype",
]

# Run with `uv run pytest --cov` (CI does). The floor sits just below the measured total (90.93% on SQLite; CI also
# runs PostgreSQL-only tests); raise it as tests are added
# and never lower it to land a change.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 90
skip_covered = true

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.environment]
python-version = "3.15"
