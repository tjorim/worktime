<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worktime - Schedule & Time Off</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/icon-48.png" />

    <!-- iOS home screen icon and standalone-mode support (Safari ignores the web manifest) -->
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Worktime" />

    <meta

      content="Work schedule tracker and time-off manager supporting multiple roster patterns"

    <meta name="theme-color" content="#0d6efd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d1e" media="(prefers-color-scheme: dark)" />

    <!-- Color scheme support for browser native UI elements -->
    <meta name="color-scheme" content="light dark" />
