allowBuilds:
  "@parcel/watcher": true
  browser-tabs-lock: true
  canvas: true
  esbuild: true
  msw: true

# pnpm's minimumReleaseAge doesn't fall back to an older mature version for transitive
# deps it can't bump directly - it hard-fails the whole update instead
# (https://github.com/pnpm/pnpm/issues/11068), which hits automated lockfile refreshes. browserslist and
# caniuse-lite release multiple times a week, so they trip this constantly; exempt them
# since they're low-risk, frequently-updated metadata packages.
minimumReleaseAgeExclude:
  - browserslist
  - caniuse-lite

# Keep the one-day quarantine for new dependency releases, including frozen installs.
minimumReleaseAge: 1440
