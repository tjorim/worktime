version: 2
updates:
  # Monitor npm dependencies for the main Worktime project
  - package-ecosystem: "npm"
    allow:
      - dependency-type: all
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "platform:frontend"
    versioning-strategy: "increase"
    groups:
      # Group React core with its types (tightly coupled)
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Group Vite with its React plugin (build tool + framework plugin)
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # Group testing tools together (all dev dependencies)
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
      # Group Day.js with plugins (date handling)
      dayjs:
        patterns:
          - "dayjs"
      # Group OXC toolchain (Rust-based linting and formatting)
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-parser"
      i18n:
        patterns:
          - "@inlang/*"
      # oidc-client-ts is the engine react-oidc-context wraps
      oidc:
        patterns:
          - "oidc-client-ts"
          - "react-oidc-context"
      # tailwindcss and its Vite plugin share one release train
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/playwright"
      # vite-plugin-pwa generates the service worker that workbox-window registers
      pwa:
        patterns:
          - "vite-plugin-pwa"
          - "workbox-window"
      # Group TanStack packages (DB pipelines must update together or they fail;
      # react-query, router, table, form and charts are one family too)
      tanstack:
        patterns:
          - "@tanstack/*"
      # Group Schedule-X packages (calendar component + its plugins)
      schedule-x:
        patterns:
          - "@schedule-x/*"
      # Group d3 micro-packages (transitive chart dependencies, released individually)
      d3:
        patterns:
          - "d3-*"
      # Group the UI kit: Base UI runtime, shadcn CLI/lint and its Lucide icons
      # (see docs/ui-maintenance.md; run `pnpm ui:check` on these PRs)
      ui:
        patterns:
          - "@base-ui/*"
          - "@base-ui-components/*"
          - "shadcn"
          - "@shadcn/*"
          - "lucide-react"

  # Monitor uv-managed Python dependencies for backend API
  - package-ecosystem: "uv"
    allow:
      - dependency-type: all
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:backend"
      - "python"
    groups:
      # fastmcp pulls in mcp, mcp-types and cyclopts; keep them moving together
      fastmcp:
        patterns:
          - "fastmcp"
          - "fastmcp-slim"
          - "mcp"
          - "mcp-types"
          - "cyclopts"
      # OIDC/JWT libraries on the auth path; update together
      auth:
        patterns:
          - "authlib"
          - "joserfc"
          - "google-auth"
          - "pyjwt"
          - "cryptography"
      # Postgres driver, SQLAlchemy/Alembic and the SQLite driver for dev/tests
      database:
        patterns:
          - "psycopg*"
          - "asyncpg"
          - "sqlalchemy"
          - "alembic"
          - "aiosqlite"
      # Keep Pydantic, its validation core, and settings integration together
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      python-quality:
        patterns:
          - "ruff"
          - "ty"
          - "pytest"
          - "pytest-asyncio"

  # Monitor Android Gradle dependencies and wrapper versions
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps(android)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:android"

  # Monitor Docker images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Monitor Docker Compose files
  - package-ecosystem: "docker-compose"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps(compose)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
