version: 2
updates:
  # Monitor npm dependencies for the main Worktime project
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    versioning-strategy: "increase"
    groups:
      # Group React core with its types (tightly coupled)
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Group React Bootstrap with Bootstrap (UI framework)
      bootstrap:
        patterns:
          - "bootstrap"
          - "bootstrap-icons"
          - "react-bootstrap"
      # Group Vite with its React plugin (build tool + framework plugin)
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # Group testing tools together (all dev dependencies)
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
      # Group Day.js with plugins (date handling)
      dayjs:
        patterns:
          - "dayjs"
      # Group OXC toolchain (Rust-based linting and formatting)
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
      i18n:
        patterns:
          - "@inlang/*"
      # Group TanStack DB packages (must update together or pipelines fail)
      tanstack-db:
        patterns:
          - "@tanstack/query-db-collection"
          - "@tanstack/react-db"

  # Monitor uv-managed Python dependencies for backend API
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
      - "python"
    groups:
      python-quality:
        patterns:
          - "ruff"
          - "ty"

  # Monitor Android Gradle dependencies and wrapper versions
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps(android)"
      include: "scope"
    labels:
      - "dependencies"
      - "android"

  # Monitor Docker images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Monitor Docker Compose files
  - package-ecosystem: "docker-compose"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps(compose)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
