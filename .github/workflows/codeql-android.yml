name: CodeQL Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/codeql-android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/codeql-android.yml"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Android (Java/Kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check CodeQL Kotlin support
        id: codeql-kotlin
        run: |
          set -euo pipefail
          kotlin_version="$(awk -F '"' '/^kotlin = / { print $2 }' android/gradle/libs.versions.toml)"
          max_supported="2.3.29"
          if printf '%s\n%s\n' "${kotlin_version}" "${max_supported}" | sort -V -C; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping CodeQL java-kotlin analysis: Kotlin ${kotlin_version} is newer than CodeQL's current Kotlin support."
          fi

      - name: Initialize CodeQL
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: java-kotlin

      - name: Autobuild
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Perform CodeQL analysis
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
