name: CodeQL Android

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CodeQL Kotlin support
        id: codeql-kotlin
        run: |
          set -euo pipefail
          kotlin_version="$(awk -F '"' '/^kotlin = / { print $2 }' android/gradle/libs.versions.toml)"
          # CodeQL 2.26.x supports Kotlin below 2.4.10 (2.4.0x only, not the
          # whole 2.4.x series). Verify the exact bound in the CodeQL docs
          # before raising this:
          # https://codeql.github.com/docs/codeql-overview/supported-languages-and-frameworks/
          max_supported="2.4.9"
          if printf '%s\n%s\n' "${kotlin_version}" "${max_supported}" | sort -V -C; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping CodeQL java-kotlin analysis: Kotlin ${kotlin_version} is newer than CodeQL's current Kotlin support."
          fi

      - name: Initialize CodeQL
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Set up JDK 25
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build for analysis
        if: steps.codeql-kotlin.outputs.supported == 'true'
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin

      - name: Perform CodeQL analysis
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:java-kotlin
