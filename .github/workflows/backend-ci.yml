name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Lint, Typecheck, Tests & Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: worktime
          POSTGRES_PASSWORD: worktime
          POSTGRES_DB: worktime_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check app

      - name: Typecheck (ty)
        run: uv run ty check app

      - name: Test
        env:
          DB_USER: worktime
          DB_PASSWORD: worktime
        run: TEST_DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@localhost/worktime_test" uv run pytest

      - name: Migration upgrade check
        env:
          DB_USER: worktime
          DB_PASSWORD: worktime
        run: DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@localhost/worktime_test" uv run alembic upgrade head
