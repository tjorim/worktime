name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Lint, Typecheck, Tests & Migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://worktime:worktime@localhost:5432/worktime_test
      TEST_DATABASE_URL: postgresql+asyncpg://worktime:worktime@localhost:5432/worktime_test
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: worktime
          POSTGRES_PASSWORD: worktime
          POSTGRES_DB: worktime_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (ty)
        run: uv run ty check .

      - name: Test
        run: uv run pytest

      - name: Migration upgrade check
        run: uv run alembic upgrade head

      - name: Verify migrations are in sync with models
        run: uv run alembic check
