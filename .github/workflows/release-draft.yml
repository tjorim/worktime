name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate-release-metadata:
    name: Validate tag & versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate strict SemVer tag
        id: semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$TAG' is invalid. Expected strict SemVer format: vX.Y.Z"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate frontend/package.json version
        env:
          EXPECTED_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -euo pipefail
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"
          if [[ "$FRONTEND_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "frontend/package.json version '$FRONTEND_VERSION' does not match '$EXPECTED_VERSION'"
            exit 1
          fi

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    needs: validate-release-metadata
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: worktime
          POSTGRES_PASSWORD: worktime
          POSTGRES_DB: worktime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check app

      - name: Typecheck (ty)
        run: uv run ty check app

      - name: Test
        env:
          DB_USER: worktime
          DB_PASSWORD: worktime
        run: TEST_DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@localhost/worktime_test" uv run pytest

      - name: Migration upgrade check
        env:
          DB_USER: worktime
          DB_PASSWORD: worktime
        run: DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@localhost/worktime_test" uv run alembic upgrade head

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: validate-release-metadata
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version consistency
        run: pnpm run check-version-consistency

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Generate changelog
        run: pnpm run generate-changelog

  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs:
      - validate-release-metadata
      - backend-checks
      - frontend-checks
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.validate-release-metadata.outputs.version }}
          draft: true
          generate_release_notes: true
