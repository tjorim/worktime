name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate-release-metadata:
    name: Validate tag, versions & changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      # The tag, VERSION, frontend/package.json and the CHANGELOG must agree
      # (scripts/release.mjs; configuration in release.config.json). Android
      # versionName/versionCode are read from VERSION in android/app/build.gradle.kts, and
      # backend/pyproject.toml's version field is frozen at "0.0.0" (packaging metadata only; the
      # backend reads VERSION via backend/app/version.py), so neither can drift.
      - name: Validate tag, versions and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check --tag "$TAG"

      - name: Read version
        id: semver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    needs: validate-release-metadata
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: worktime
          POSTGRES_PASSWORD: worktime
          POSTGRES_DB: worktime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check app

      - name: Typecheck (ty)
        run: uv run ty check app

      - name: Test
        env:
          DB_USER: worktime
          DB_PASSWORD: worktime
        run: TEST_DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@localhost/worktime_test" uv run pytest

      - name: Migration upgrade check
        env:
          DB_USER: worktime
          DB_PASSWORD: worktime
        run: DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@localhost/worktime_test" uv run alembic upgrade head

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: validate-release-metadata
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck tests
        run: pnpm run typecheck:tests

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs:
      - validate-release-metadata
      - backend-checks
      - frontend-checks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      - name: Extract release notes from the changelog
        run: node scripts/release.mjs notes > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.validate-release-metadata.outputs.version }}
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
