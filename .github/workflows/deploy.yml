name: Deploy Worktime to GitHub Pages

on:
  # Deploy when a GitHub Release is published (tag-based)
  release:
    types: [published]

  # Manual emergency deploys — version comes from package.json
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy Worktime files only
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Strip the leading "v" from the tag name
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "trigger=release" >> "$GITHUB_OUTPUT"
            echo "Deploying release version: $VERSION"
          else
            # Manual dispatch — read version from package.json
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "trigger=manual" >> "$GITHUB_OUTPUT"
            echo "Manual deploy with package.json version: $VERSION"
          fi
      - name: Sync package.json version
        if: github.event_name == 'release'
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Build minified assets
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare deployment
        run: |
          echo "Preparing Worktime for deployment..."

          # Create deployment directory if it doesn't exist
          mkdir -p _site

          if [ ! -d "dist" ]; then
            echo "dist directory not found. Did the build step run successfully?"
            exit 1
          fi

          # Copy Vite build contents directly into _site (not nested)
          cp -r dist/. _site/

          echo "Deployment contents:"
          find _site -type f | sort
          echo "Worktime ready for deployment!"

      - name: Generate deployment info
        run: |
          cat > _site/_deployment-info.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "trigger": "${{ steps.version.outputs.trigger }}"
          }
          EOF
          echo "Generated _deployment-info.json:"
          cat _site/_deployment-info.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload only the clean frontend files
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
