name: .hday Helper CI

on:
  pull_request:
    paths:
      - "hday-helper/**"
      - "frontend/src/lib/hday/**"
      - ".github/workflows/hday-helper-ci.yml"
  push:
    branches: [main]
    paths:
      - "hday-helper/**"
      - "frontend/src/lib/hday/**"
      - ".github/workflows/hday-helper-ci.yml"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helper:
    name: Build Helper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"

      - name: Build helper executable
        run: bun build hday-helper/src/main.ts --compile --outfile /tmp/worktime-hday-helper

      - name: Verify executable
        run: test -f /tmp/worktime-hday-helper
